<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.container{
    width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.top{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.top input{
    flex:1;
    padding:10px;
}

.top button{
    padding:10px 20px;
}

.student-name{
    font-size:18px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#3498db;
    color:white;
}

input.score{
    width:70px;
    text-align:center;
    padding:5px;
}

.buttons{
    margin-top:25px;
    text-align:center;
}

.buttons button{
    padding:12px 20px;
    margin:5px;
}
.add-student {
    margin-top: 25px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.add-student h2 {
    margin-top: 0;
}

.add-student input {
    margin: 5px;
    padding: 10px;
}
</style>

</head>

<body>

<div class="container">

<h1>Teacher Dashboard</h1>

<div class="top">

<input
type="text"
id="studentID"
placeholder="Enter Student ID (Example:1001)">

<button id="loadBtn">
Load Student
</button>

</div>

<div class="student-name">

<strong>Student Name:</strong>

<span id="studentName">
No student loaded
</span>

</div>
<div class="add-student"><div class="student-list">

    <h2>Student List</h2>
<input
    type="text"
    id="studentSearch"
    placeholder="Search Student ID or Name">
    <table>

        <thead>

            <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="studentList">

            <tr>
                <td colspan="3">
                    Loading students...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<h2>Add New Student</h2>

<input
type="text"
id="newStudentID"
placeholder="Student ID">

<input
type="text"
id="newStudentName"
placeholder="Student Name">

<input
type="text"
id="newStudentPassword"
placeholder="Password">

<button id="addStudentBtn">
Add Student
</button>

</div>

<table>

<tr>

<th>Subject</th>

<th>Score</th>

</tr>

<tr>

<td>AP</td>

<td><input class="score" id="AP"></td>

</tr>

<tr>

<td>FIL</td>

<td><input class="score" id="FIL"></td>

</tr>

<tr>

<td>HELE</td>

<td><input class="score" id="HELE"></td>

</tr>

<tr>

<td>Music & Arts</td>

<td><input class="score" id="MUSICandArts"></td>

</tr>

<tr>

<td>PE & Health</td>

<td><input class="score" id="PEandHealth"></td>

</tr>
<tr>

<td>English</td>

<td><input class="score" id="English"></td>

</tr>

<tr>

<td>Mathematics</td>

<td><input class="score" id="Mathematics"></td>

</tr>

<tr>

<td>Science</td>

<td><input class="score" id="Science"></td>

</tr>

<tr>

<td>GMRC</td>

<td><input class="score" id="GMRC"></td>

</tr>
</table>

<div class="buttons">

<button id="saveBtn">

💾 Save Changes

</button>

<button onclick="window.location.href='teacher.html'">

Logout

</button>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCUZmbjsWOGgs8chdBOIVfoY8RNAeGwk7s",
    authDomain: "studentscores-c9ad1.firebaseapp.com",
    projectId: "studentscores-c9ad1",
    storageBucket: "studentscores-c9ad1.firebasestorage.app",
    messagingSenderId: "627785600117",
    appId: "1:627785600117:web:eaa750b8583929dda0fc3c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Check if teacher is logged in
onAuthStateChanged(auth, (user) => {

    if (!user) {
        // Not logged in → return to Teacher Login
        window.location.href = "teacher.html";
    }

});

// Logout button
document.querySelector(".buttons button:last-child").addEventListener("click", async () => {

    await signOut(auth);

    window.location.href = "teacher.html";

});
</script>

<script type="module" src="teacher-dashboard.js"></script>

</body>
</html>
