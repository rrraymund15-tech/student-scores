```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        .login-box {
            width: 300px;
            margin: auto;
            padding: 25px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 6px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Teacher Login</h2>

    <input
        type="email"
        id="username"
        placeholder="Email"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <br>

    <button id="loginButton">Login</button>

    <p id="message"></p>

</div>

<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCUZmbjsWOGgs8chdBOIVfoY8RNAeGwk7s",
        authDomain: "studentscores-c9ad1.firebaseapp.com",
        projectId: "studentscores-c9ad1",
        storageBucket: "studentscores-c9ad1.firebasestorage.app",
        messagingSenderId: "627785600117",
        appId: "1:627785600117:web:eaa750b8583929dda0fc3c"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Teacher login
    document.getElementById("loginButton").addEventListener("click", async function () {

        const email = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "";

        if (email === "" || password === "") {
            message.textContent = "Please enter your email and password.";
            return;
        }

        try {

            await signInWithEmailAndPassword(auth, email, password);

            // Login successful
            window.location.href = "teacher-dashboard.html";

        } catch (error) {

            console.error(error);

            message.textContent = "Incorrect email or password.";

        }

    });

</script>

</body>
</html>
